# Project identification
sonar.projectName=Intuji-JS-Project
sonar.projectKey=intuji-js-project
sonar.projectVersion=1.0
sonar.language=js

# Sources
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclude directories
sonar.exclusions=node_modules/**, dist/**, coverage/**, build/**, public/**, .next/**, .build/**, .cache/**, .github/**, .vscode/**, .idea/**

# Airbnb JavaScript Style Guide Rules

# Indentation rule - 2 spaces
sonar.issue.ignore.multicriteria=indentation
sonar.issue.ignore.multicriteria.indentation.ruleKey=javascript:IndentationCheck
sonar.issue.ignore.multicriteria.indentation.parameters=indentation=2

# Line endings - Unix style
sonar.javascript.linter.eol=lf

# String quotes - use single quotes
sonar.javascript.linter.quotes=single

# Semicolons required
sonar.javascript.linter.semicolons=always

# Arrow Function Rules
sonar.javascript.linter.arrowBodyStyle=as-needed
sonar.javascript.linter.arrowParens=always
sonar.javascript.linter.arrowSpacing=true

# Variable Rules
sonar.javascript.linter.noVar=true
sonar.javascript.linter.preferConst=true
sonar.javascript.linter.noUnusedVars=true

# Object Rules
sonar.javascript.linter.objectCurlySpacing=always
sonar.javascript.linter.objectShorthand=always

# Array Rules
sonar.javascript.linter.arrayBracketSpacing=never
sonar.javascript.linter.arrayCallbackReturn=true

# React Rules
sonar.javascript.linter.reactJsxFilenameExtension=jsx,tsx
sonar.javascript.linter.reactJsxIndent=2
sonar.javascript.linter.reactJsxIndentProps=2
sonar.javascript.linter.reactJsxKey=true
sonar.javascript.linter.reactJsxNoDuplicateProps=true
sonar.javascript.linter.reactJsxNoUndef=true
sonar.javascript.linter.reactJsxPascalCase=true
sonar.javascript.linter.reactPreferStatelessFunction=true
sonar.javascript.linter.reactRequireDefaultProps=true

# Import Rules
sonar.javascript.linter.importExtensions=never
sonar.javascript.linter.importNoExtraneousDependencies=true
sonar.javascript.linter.importNoUnresolved=true
sonar.javascript.linter.importPreferDefaultExport=true

# Line Length Rule
sonar.javascript.linter.maxLen=100

# Console and Debugger
sonar.javascript.linter.noConsole=warn
sonar.javascript.linter.noDebugger=error

# Special Overrides for JSX Files
sonar.issue.ignore.multicriteria.jsxFiles.ruleKey=javascript:ReactJsxPropsNoSpreading
sonar.issue.ignore.multicriteria.jsxFiles.resourceKey=**/*.jsx,**/*.tsx
sonar.issue.ignore.multicriteria.jsxFiles.severity=MINOR

# Code Complexity - Maximum complexity per function
sonar.javascript.maxComplexityPerFunction=15

# Security - Require all security hotspots to be reviewed
sonar.securityHotspotReviewRequiredThreshold=100